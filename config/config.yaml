ai_trader:
  config_file: config/ai_trader.json
  # 开源默认关闭：需要时手动改 true 并提供 config/ai_trader.json
  enabled: false
  sync_to_okx: false
alert:
  max_daily_loss: 20
  max_pnl: -20
  min_equity: 50
  min_interval: 300
  webhook_url: ''
exchange:
  okx:
    # 1 = 模拟盘（开源默认）；0 = 实盘。切换实盘前请先按你的资金重算风控参数。
    flag: '1'
    key_file: data/keys.enc
    proxy: ''
futures:
  long:
    enabled: true
    base_position_usdt: 3.0
    add_step: 0.00159
    add_multiplier: 1.08
    max_add_layers: 5
    first_tp_ratio: 0.007
    final_tp_ratio: 0.01
    trailing_enabled: true
    trailing_tp_retreat: 0.015
    entry_trigger_price: 0
    entry_trigger_condition: below
  short:
    enabled: true
    base_position_usdt: 3.0
    add_step: 0.00159
    add_multiplier: 1.08
    max_add_layers: 5
    first_tp_ratio: 0.007
    final_tp_ratio: 0.01
    trailing_enabled: true
    trailing_tp_retreat: 0.015
    entry_trigger_price: 0
    entry_trigger_condition: above
  account_margin_buffer_ratio: 0.10
  account_margin_scope: shared_okx_account
  # Shared-account margin bands: soft is sizing/throttling only; hard pauses
  # new risk at 30%. Recovery below 29% clears the hard latch. mgnRatio
  # remains an independent exchange-health guard.
  account_margin_soft_limit: 0.40
  account_margin_hard_limit: 0.57
  account_margin_resume_limit: 0.55
  net_reducing_hard_margin_exempt_enabled: true
  mgn_ratio_open_limit: 8.0
  mgn_ratio_pause_limit: 5.0
  mgn_ratio_emergency_limit: 3.0
  account_risk_max_age_sec: 15
  add_cooldown: 120
  add_multiplier: 1.08
  add_step: 0.00159
  # Drift/rebuild tolerance. The implicit default of 0.0025 sat only
  # 1.57x above add_step and rebuilt the ladder on every small tick.
  order_refresh_tolerance_pct: 0.005
  auto_compound_ratio: 0
  base_position_usdt: 3.0
  final_tp_ratio: 0.01
  first_tp_ratio: 0.007
  grid_bias_ratio: 0.90
  # Keep at least one normal grid layer while account margin is below the
  # shared 30% hard line; other risk, budget, TP and exposure checks remain.
  grid_expand_margin_ratio: 0.50
  leverage: 5
  margin_mode: cross
  max_add_layers: 5
  max_long_pos: 10
  max_side_notional_usdt: 600
  # Independent gross capacity for each hedge side; the shared field above is fallback-only.
  max_long_side_notional_usdt: 2000
  max_short_side_notional_usdt: 1400
  max_total_notional_usdt: 3200
  max_net_notional_usdt: 2200
  margin_first_max_margin_ratio: 0.50
  margin_first_capacity_enabled: true
  # Wick filter blocks counter-trend adds inside impulsive 5m candles, which is
  # the opposite of what a mean-reversion grid needs. Disabled for CRV.
  wick_filter_enabled: false
  # Ladder depth. Measured touches per 24h (step 0.159%): L1 294, L2 135, L3 60,
  # L4 29, L5 17, L6+ single digits -> 5 layers is the knee of the curve.
  # grid_expand_margin_ratio 0.28 automatically drops this to 1 when margin tightens.
  grid_max_layers: 4
  # Both hedge sides sit within ~1% of each other; treat that as no dominant side
  # so THROTTLED stops vetoing the short leg entirely.
  throttle_dominant_gap_ratio: 1.0
  # THROTTLED must not veto the dominant side while this symbol's own net
  # exposure is still inside max_net_notional_soft_usdt. Without this a
  # profile that is one-sided inside its own caps (RAM net -238 vs 300 soft)
  # stays frozen at account level and can never rebuild the missing leg.
  throttle_dominant_net_budget_gate_enabled: true
  # Internal capacity is a soft throttle; hard account/mgnRatio risk remains reduce-only.
  over_cap_unwind_enabled: true
  over_cap_unwind_target_ratio: 0.90
  over_cap_unwind_stage_ratio: 0.15
  over_cap_unwind_max_notional_usdt: 36
  over_cap_unwind_min_notional_usdt: 6
  over_cap_unwind_cooldown_sec: 60
  # Pull stranded layer TPs (pinned at historical layer entries) back toward
  # cost. tp_rehang_dry_run=true only logs the intended move.
  tp_rehang_enabled: true
  tp_rehang_dry_run: false
  tp_rehang_min_gap_ratio: 0.02
  tp_rehang_step_ratio: 0.5
  tp_rehang_cooldown_sec: 900
  tp_rehang_state_ttl_hours: 24
  # Clamp TP to stay inside the exchange price band (OKX 51006).
  tp_price_band_enabled: true
  tp_price_band_gap_ratio: 0.003
  tp_rehang_max_times: 4
  tp_rehang_net_headroom: 0.8
  dynamic_side_notional_enabled: false
  dynamic_side_notional_equity_ratio: 0.30
  dynamic_side_notional_margin_budget_ratio: 0.80
  dynamic_side_notional_max_margin_ratio: 0.35
  dynamic_side_notional_max_multiplier: 1.40
  weak_side_margin_ratio: 1.05
  weak_side_margin_imbalance_threshold: 0.25
  max_margin_ratio: 0.28
  max_short_pos: 10
  max_tp_orders: 40
  # Net-reducing repair orders may clear at modeled break-even; ordinary adds
  # keep the normal expected-edge floor.
  inventory_repair_relax_edge_enabled: true
  # Opt-in CRV test: equal-sized two-leg additions after an adverse move.
  # Existing account budget, total-cap, net-cap and exchange checks remain hard.
  paired_add_enabled: false
  # Permit only bounded net-neutral pairs while ordinary opens stay paused.
  paired_add_allow_inventory_pause: false
  paired_add_max_margin_ratio: 0.15
  paired_add_use_hard_total_cap: true
  paired_average_down_enabled: false
  paired_add_cooldown_sec: 60
  paired_add_trigger_ratio: 0.004
  active_inventory_repair_enabled: false
  inventory_repair_imbalance_gate: 0.50
  inventory_repair_max_margin_ratio: 0.15
  inventory_repair_side_cap_multiplier: 1.10
  # Sole hard-margin exception: CRV net-short repair only. It permits one
  # small buy/long step when all policy checks project account load below 63%.
  # Normal CRV grids plus DRAM and FART remain at the shared 30% hard line.
  inventory_repair_hard_override_enabled: false
  inventory_repair_hard_override_symbol: CRV-USDT-SWAP
  inventory_repair_hard_override_margin_ratio: 0.63
  inventory_repair_hard_override_mgn_ratio_min: 12.0
  inventory_repair_hard_override_max_step_notional_usdt: 8.0
  # Weak-side repair is bounded by side/total/net caps and account hard risk;
  # it must not deadlock merely because ordinary grid layers are full.
  inventory_repair_ignore_layer_cap: true
  inventory_repair_missing_side_margin_ratio: 0.15
  inventory_repair_missing_side_resume_ratio: 0.12
  coverage_safety_tp_enabled: true
  coverage_safety_tp_max_gap_ratio: 0.10
  coverage_safety_tp_max_loss_usdt: 0.05
  coverage_safety_tp_repair_limit: 1
  hard_stop_enabled: false
  reduce_only_mode: false
  max_loss_usdt: 30
  max_drawdown: 0.08
  daily_loss_limit_usdt: 2000
  daily_drawdown: 0.30
  min_edge_ratio: 0.004
  min_expected_net_usdt: 0.025
  inventory_age_reduce_strength: 0.30
  recent_side_loss_guard_enabled: false
  min_open_equity_usdt: 40
  position_pct: 0.02
  reserved_usdt: 20
  startup_auto_hedge_missing_side: false
  startup_rebuild_grids: true
  symbol: CRV-USDT-SWAP
  trailing_tp_retreat: 1.015
  trend_bias_strength: 1.05
global:
  # 开源默认模拟盘，须与 exchange.okx.flag='1' 保持一致；切实盘时两者同时改
  demo: true
  enable_futures: true
  enable_spot: false
  kline_interval: 5m
  kline_limit: 210
  tick_interval: 3
kelly:
  default_kelly: 1.25
  enabled: true
  max_kelly: 1.5
  min_kelly: 1.02
logging:
  backup_count: 3
  console: false
  file: logs/trading.log
  level: INFO
  max_size_mb: 10
moca:
  apply_live: false
  adaptation_range:
    add_layers:
    - 1.0
    - 1.5
    grid_density:
    - 1.5
    - 2.1
    leverage:
    - 1.0
    - 1.5
    tp_ratio:
    - 1.0
    - 1.5
  atr_period: 14
  bb_period: 21
  bb_std: 2.1
  enabled: true
  thresholds:
    extreme_volatility: 1.08
    high_volatility: 1.03
    trend_strength: 28
    volume_spike: 3.1
    wick_ratio: 2.5
  timeframes:
  - 5m
  - 15m
  - 1H
network:
  order_retry:
    max_retries: 3
    retry_delay: 1
  reconnect:
    exponential_backoff: true
    max_retries: 11
    retry_interval: 5
  websocket:
    enabled: true
    ping_interval: 21
notify:
  email:
    email_env: OKX_NOTIFY_SMTP_EMAIL
    enabled: true
    min_interval: 61
    password_env: OKX_NOTIFY_SMTP_PASSWORD
    smtp_port: 465
    smtp_server: smtp.qq.com
    to_env: OKX_NOTIFY_SMTP_TO
recorder:
  auto_export_days: 7
  export_dir: data/exports
  pnl_file: data/pnl_records.csv
risk:
  account_budget:
    target_margin_ratio: 0.25
    reserve_equity_ratio: 0.15
    utilization: 0.80
    reservation_ttl_sec: 20
  black_swan:
    auto_restart: false
    consecutive_drop: 3
    cooldown_seconds: 610
    enabled: true
    price_jump_threshold: 1.05
  liquidation:
    action_cooldown_seconds: 60
    confirmation_checks: 2
    emergency_distance_rate: 0.07
    emergency_reduce_ratio: 0.25
    enabled: true
    pause_opening_seconds: 120
    safety_distance_rate: 0.15
  stop_loss:
    account_data_grace_seconds: 30
    cooldown_seconds: 610
    enabled: false
    total_loss_pct: 4
segment_close:
  close_offset: 0.01
  enable: false
  order_refresh_ms: 2000
  price_buffer: 0.003
  segment_layer_limit: 3
spot:
  first_layer_ratio: 0.15
  grid_step: 0.003
  invest_usdt: 110
  layer_multiplier: 1.2
  max_layers: 11
  min_order_interval: 61
  symbol: BTC-USDT
  take_profit_ratio: 0.015
  tp_sell_ratios:
  - 1.3
  - 1.3
  - 1.2
  - 1.1
  - 1.1

